name: tseries
description: >-
  Time-series analysis for Dart: ARIMA, SARIMA and SARIMAX on the ctsa C
  library via FFI, automatic order selection (autoArima) and pure-Dart
  forecasting primitives.
version: 0.8.0
repository: https://github.com/Vladislav-Zyuzko/tseries
issue_tracker: https://github.com/Vladislav-Zyuzko/tseries/issues
topics:
  - time-series
  - forecasting
  - arima
  - sarimax
  - ffi


platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

# `ffi` is the runtime FFI helper (Arena/calloc). `native_toolchain_c`, `hooks`
# and `code_assets` drive the native build hook (hook/build.dart).
dependencies:
  # Lower bounds are what Flutter 3.38 can resolve (its SDK pins meta 1.17.0,
  # while native_toolchain_c >= 0.19.3 and hooks >= 2.1.0 need meta ^1.19.0);
  # pure-Dart consumers resolve the latest. Both ends are tested.
  code_assets: '>=1.2.1 <3.0.0'
  ffi: ^2.2.0
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.2

dev_dependencies:
  ffigen: ^15.0.0
  lints: ^6.0.0
  test: ^1.25.6
